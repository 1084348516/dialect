# 名字要和 Cloudflare 后台的 Worker 名称一致，否则自动构建会失败
name = "dialect"
main = "worker/index.js"
compatibility_date = "2025-09-01"
# FEEDBACK_EMAIL_TO / FEEDBACK_EMAIL_FROM 只在 Cloudflare 后台设置（不把邮箱写进仓库），部署时保留后台的变量
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "familect"
database_id = "01cf7b40-05ae-4224-ac93-4b866292ad2d"
migrations_dir = "migrations"

# 反馈邮件通知：依赖 familect.org 的 Email Routing，收件邮箱需在其中验证
[[send_email]]
name = "SEND_EMAIL"

# 反馈接口按 IP 限流：每个 IP 每分钟最多 3 条（period 只能是 10 或 60 秒）
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }
