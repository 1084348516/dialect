# 名字要和 Cloudflare 后台的 Worker 名称一致，否则自动构建会失败
name = "dialect"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "familect"
database_id = "01cf7b40-05ae-4224-ac93-4b866292ad2d"
migrations_dir = "migrations"

# 启用 Email Routing 后，取消下面的注释，并在 Worker 设置中加入 FEEDBACK_EMAIL_TO / FEEDBACK_EMAIL_FROM
# [[send_email]]
# name = "SEND_EMAIL"
