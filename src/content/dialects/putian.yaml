    category: people

  - id: ha-lian-nai
    text: 下联奶
    alt: [下练奶]
    pron: ha lian nai
    homophone: 下联奶
    enReading: hah-lyen-NYE
    zh: 骂人的脏话
    en: a curse word
    meaning: 骂人的脏话，意思接近"要命""找死""混蛋"，属于比较恶毒的诅咒，常被当口头禅。
    meaningEn: A curse, roughly "damn you" / "go to hell" / "bastard". Quite vicious, though often used as a verbal tic.
    note: 日常生活中应避免使用。
    noteEn: Avoid using it in everyday conversation.
    category: crude

  - id: di-iu-gua-sao
    text: 猪油刮骚
    alt: [猪锅刮骚]
    pron: di iu gua sao
    homophone: 地有挂扫
    enReading: dee-yoo-gwah-SOW
    zh: 气死了；真火大
    en: so pissed off
    meaning: 表达愤怒的情绪，可以理解为"气死了""真是火大"。
    meaningEn: An angry outburst, roughly "I'm so mad" / "this is infuriating".
    category: crude

  - id: sa-du-lo-man
    text: 撒嘟咯满
    alt: [撒都满]
    pron: sa du lo man
    homophone: 撒嘟咯满
    enReading: sah-doo-loh-MAHN
    zh: 骂人、发火的粗话
    en: a crude curse
    meaning: 表达愤怒、咒骂或极不耐烦的粗俗用语。
    meaningEn: A crude expression of anger, cursing or extreme impatience.
    category: crude
