    enReading: sah-doo-loh-MAHN
    zh: 骂人、发火的粗话
    en: a crude curse
    meaning: 表达愤怒、咒骂或极不耐烦的粗俗用语。
    meaningEn: A crude expression of anger, cursing or extreme impatience.
    category: crude
