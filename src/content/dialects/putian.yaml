name: 莆田话
nameEn: Putian (Puxian Min)
status: live
order: 6
reviewed: false
areas: 莆田、仙游，东南亚莆仙籍华人
areasEn: Putian and Xianyou; Puxian communities in Southeast Asia
intro: 通行于福建莆田、仙游一带，属闽语莆仙片，和闽南语相近但读音差别很大。词条拼读为按普通话近似记音。
introEn: Spoken around Putian and Xianyou in Fujian. It belongs to the Puxian branch of Min Chinese — related to Hokkien but quite different in pronunciation. Readings are rough Mandarin-based approximations.
romanization: { name: 近似拼读, nameEn: Approximate reading }

categories:
  - { id: daily, name: 日常用语, nameEn: Everyday }
  - { id: people, name: 人称, nameEn: People & pronouns }
  - { id: kinship, name: 亲属称谓, nameEn: Family }
  - { id: food, name: 饮食, nameEn: Food }
  - { id: slang, name: 俚语, nameEn: Slang }
  - { id: crude, name: 粗口, nameEn: Crude, caution: true }

entries:
  - id: ha-bo
    text: 食饱
    pron: ha bo
    homophone: 虾波
    enReading: hah-BOH
    zh: 吃饱
    en: to be full (after eating)
    meaning: 吃饱了。闽语里“吃”都说“食”，问别人吃了没常说“食糜未？”。
    meaningEn: To be full after eating. Min dialects say 食 for "eat"; to ask whether someone has eaten, say "食糜未?".
    category: daily

  - id: ha-man
    text: 食饭
    pron: ha man
    homophone: 虾满
    enReading: hah-MAHN
    zh: 吃早饭
    en: to eat breakfast
    meaning: 莆田话里“食饭”专指吃早饭，不是泛指吃饭。莆田人用不同的说法区分三餐：早饭“食饭”，午饭“食昼”，晚饭“食糜”或“食暝”；平常说的吃饭一般用“食糜”。
    meaningEn: In Putian, 食饭 means specifically "to eat breakfast", not eating in general. Each meal has its own word — breakfast 食饭, lunch 食昼, dinner 食糜 or 食暝 — and 食糜 is the usual word for "to eat".
    category: daily

  - id: ha-ma
    text: 食糜
    pron: ha ma
    homophone: 虾麻
    enReading: hah-MAH
    zh: 吃饭；吃稀饭
    en: to eat (a meal); to eat congee
    literal: 吃粥
    meaning: “糜”是粥、稀饭，“食糜”字面是吃粥，但平常用来泛指吃饭，也可以特指吃晚饭。莆田人见面最常用的问候就是“食糜未？”（吃饭了吗？）。
    meaningEn: 糜 means congee, so 食糜 is literally "to eat congee", but it is the everyday word for having a meal, and can also mean dinner in particular. "食糜未?" (have you eaten?) is the most common greeting in Putian.
    note: 和“食饭”不同：“食饭”专指吃早饭。
    noteEn: Not the same as 食饭, which means breakfast only.
    category: daily

  - id: gia
    text: 行
    pron: gia
    enReading: GYAH
    zh: 走
    en: to walk; to go
    meaning: 走路。闽语里“行”是走，“走”反而是跑。
    meaningEn: To walk. In Min dialects 行 means walk, while 走 means run.
    category: daily

  - id: zao
    text: 走
    pron: zao
    homophone: 早
    enReading: DZOW
    zh: 跑
    en: to run
    meaning: 莆田话和其他闽语一样，“走”是跑的意思；平常说的走路要用“行”。
    meaningEn: As in other Min dialects, 走 means "to run". Walking is 行.
    category: daily

  - id: bo
    text: 无
    pron: bo
    homophone: 波
    enReading: BOH
    zh: 没有；不
    en: not have; no
    meaning: 表示没有、不是，用法和普通话的“没有”相近，也常放在句末表示提问。
    meaningEn: Means "not have" or "no", much like Mandarin 没有. It is also often put at the end of a sentence to make a question.
    category: daily

  - id: u
    text: 有
    pron: u
    homophone: 乌
    enReading: OO
    zh: 有
    en: to have; there is
    meaning: 有，和“无”（bo）相对。
    meaningEn: To have; there is — the opposite of 无 (bo).
    category: daily

  - id: ho
    text: 好
    pron: ho
    homophone: 齁
    enReading: HOH
    zh: 好
    en: good; OK
    meaning: 好，可以夸东西好，也可以表示答应。
    meaningEn: Good — also used to say "OK".
    category: daily

  - id: da
    text: 茶
    pron: da
    homophone: 搭
    enReading: DAH
    zh: 茶
    en: tea
    meaning: 茶。闽语里“茶”的声母读 d、t 一类的音，英语 tea 就是从闽语的读音来的。
    meaningEn: Tea. Min dialects pronounce 茶 with a d/t sound — the source of the English word "tea".
    category: daily

  - id: pa
    text: 拍
    pron: pa
    homophone: 帕
    enReading: PAH
    zh: 打
    en: to hit; to beat
    meaning: 闽语里“打”多说“拍”，比如打人、打球都可以用。
    meaningEn: Min dialects usually use 拍 for "to hit", whether hitting a person or playing a ball game.
    category: daily

  - id: kong
    text: 睏
    pron: kong
    homophone: 空
    enReading: KONG
    zh: 睡觉
    en: to sleep
    meaning: 睡觉。闽语、客家话里睡觉都说“睏”。
    meaningEn: To sleep. Min and Hakka both use 睏 for sleeping.
    category: daily

  - id: gua
    text: 我
    pron: gua
    homophone: 瓜
    enReading: GWAH
    zh: 我
    en: I; me
    meaning: 我，和闽南语的说法相近。
    meaningEn: I or me — close to the Hokkien word.
    note: 本字就是“我”，网上写成“瓜”“寡”都是谐音。
    noteEn: The proper character is 我; the 瓜 or 寡 you see online are just sound-alikes.
    category: people

  - id: dy
    text: 汝
    pron: dy
    enReading: DÜ (as in German "über")
    zh: 你
    en: you
    meaning: 莆田话的“你”写作“汝”，韵母接近普通话的 ü。
    meaningEn: The Putian word for "you" is written 汝; its vowel is close to the German ü.
    category: people

  - id: i
    text: 伊
    pron: i
    homophone: 衣
    enReading: EE
    zh: 他；她
    en: he; she
    meaning: 他、她，不分男女。
    meaningEn: He or she — one word for both.
    category: people

  - id: nang
    text: 侬
    pron: nang
    homophone: 囊
    enReading: NAHNG
    zh: 人
    en: person; people
    meaning: 人。“侬”在莆田话里就是人的意思，比如“笑死侬”（笑死人）；和上海话里“侬”是“你”不一样。
    meaningEn: Person. In Putian 侬 means "person", as in 笑死侬 (hilarious) — unlike Shanghainese, where 侬 means "you".
    category: people

  - id: ha-lian-nai
    text: 下联奶
    alt: [下练奶]
    pron: ha lian nai
    homophone: 下联奶
    enReading: hah-lyen-NYE
    zh: 骂人的脏话
    en: a curse word
    meaning: 骂人的脏话。"下"是"食"（吃）的谐音写法，字面意思和男性的体液有关，非常下流，是比较恶毒的侮辱，不过也常被当口头禅。
    meaningEn: A vulgar curse. 下 stands in for 食 ("to eat"), and the phrase literally refers to male bodily fluids. Very obscene and insulting, though often used as a verbal tic.
    literal: "“食”男性体液（下流说法）"
    note: 日常生活中应避免使用。
    noteEn: Avoid using it in everyday conversation.
    category: crude

  - id: ha-lao-yi
    text: 下老已
    pron: ha lao yi
    homophone: 下老已
    enReading: hah-low-YEE
    zh: 骂人的脏话
    en: a vulgar curse
    meaning: 骂人的脏话。"下"是"食"（吃）的谐音写法，字面意思涉及女性的私密部位，非常下流，用来侮辱人或发泄不满。
    meaningEn: A vulgar curse. 下 stands in for 食 ("to eat"), and the phrase literally refers to a woman's private parts. Very obscene — used to insult someone or vent anger.
    literal: "“食”女性私处（下流说法）"
    note: 非常粗俗冒犯，了解即可，不要对人说。
    noteEn: Highly offensive — good to recognize, not to use.
    category: crude

  - id: di-iu-gua-sao
    text: 猪油刮骚
    alt: [猪锅刮骚]
    pron: di iu gua sao
    homophone: 地有挂扫
    enReading: dee-yoo-gwah-SOW
    zh: 气死了；真火大
    en: so pissed off
    meaning: 表达愤怒的情绪，可以理解为"气死了""真是火大"。
    meaningEn: An angry outburst, roughly "I'm so mad" / "this is infuriating".
    category: crude

  - id: sa-du-lo-man
    text: 撒嘟咯满
    alt: [撒都满]
    pron: sa du lo man
    homophone: 撒嘟咯满
    enReading: sah-doo-loh-MAHN
    zh: 骂人、发火的粗话
    en: a crude curse
    meaning: 表达愤怒、咒骂或极不耐烦的粗俗用语。
    meaningEn: A crude expression of anger, cursing or extreme impatience.
    category: crude

  - id: tah-zy
    text: 读书
    alt: [踏鞠, 蹋鞠]
    pron: tah zy
    homophone: 踏鞠
    enReading: tah-ZOO
    zh: 读书
    en: to study; to go to school
    meaning: 读书、上学，网上常写成谐音的“踏鞠”。
    meaningEn: To study or go to school; online it is often written 踏鞠, which sounds similar.
    category: daily

  - id: chiao-si-nang
    text: 笑死侬
    alt: [跷席难]
    pron: chiao si nang
    homophone: 跷席难
    enReading: chyow-see-NAHNG
    zh: 笑死人
    en: hilarious; I'm dying of laughter
    meaning: 笑死人了，形容事情非常好笑。"侬"就是人。
    meaningEn: Said when something is really funny, like "I'm dying of laughter". 侬 means "person".
    category: daily

  - id: i-a
    text: 椅仔
    alt: [姨哑]
    pron: i a
    homophone: 姨哑
    enReading: EE-ah
    zh: 椅子
    en: chair
    meaning: 椅子。“仔”是闽语常见的名词后缀。
    meaningEn: A chair. 仔 is a common noun suffix in Min dialects.
    category: daily

  - id: kua-deng-si
    text: 看电视
    alt: [跨垫系]
    pron: kua deng si
    homophone: 跨垫系
    enReading: kwah-deng-SEE
    zh: 看电视
    en: to watch TV
    meaning: 莆田话"看"读 kua，和普通话差别很大。
    meaningEn: 看 ("to look/watch") is read "kua" in Putian, very different from Mandarin.
    category: daily

  - id: si-zai-bo-ha-dou
    text: 实在无法度
    alt: [真真无法度, 十在不哈抖, 静静不哈抖, 系载不哈抖]
    pron: si zai bo ha dou
    homophone: 十在不哈抖
    enReading: see-zai-boh-hah-DOW
    zh: 实在没办法
    en: there's really nothing I can do
    meaning: 实在没办法、毫无办法。"无法度"就是没办法，前面也常说"真真"（真的）。
    meaningEn: There is really no way, nothing can be done. 无法度 means "no way"; 真真 ("truly") is also often put in front.
    category: daily

  - id: cia
    text: 册
    alt: [查]
    pron: cia
    homophone: 查
    enReading: CHYAH
    zh: 书
    en: book
    meaning: 书本。莆田话和闽南语一样，把书叫"册"。
    meaningEn: A book. Like Hokkien, Putian calls a book 册.
    category: daily

  - id: deng-ua
    text: 电话
    alt: [垫瓦]
    pron: deng ua
    homophone: 垫瓦
    enReading: deng-WAH
    zh: 电话
    en: telephone; phone call
    meaning: 电话，打电话、接电话都可以用。
    meaningEn: A telephone or phone call.
    category: daily

  - id: sao-cu
    text: 扫厝
    alt: [骚凑]
    pron: sao cu
    homophone: 骚凑
    enReading: sow-CHOO
    zh: 扫地
    en: to sweep the floor
    literal: 扫屋子（"厝"是房子）
    meaning: 打扫屋子、扫地。“厝”是房子，闽语通用。
    meaningEn: To sweep or clean the house. 厝 means house across the Min dialects.
    category: daily

  - id: gua-ai-dy
    text: 我爱汝
    alt: [果爱敌]
    pron: gua ai dy
    homophone: 果爱敌
    enReading: gwah-ai-DEE
    zh: 我爱你
    en: I love you
    meaning: 我爱你。“汝”就是你。
    meaningEn: I love you. 汝 means "you".
    category: daily

  - id: a-ba
    text: 阿爸
    pron: a ba
    homophone: 阿爸
    enReading: ah-BAH
    zh: 爸爸
    en: dad
    meaning: 爸爸。当面叫、背后提起都可以用。
    meaningEn: Dad — used both to address him and to talk about him.
    note: 传统说法是“老父”（lo o），现在口语里“阿爸”也很常用。
    noteEn: The traditional word is 老父 (lo o); "a ba" is also common in everyday speech today.
    category: kinship

  - id: a-ma
    text: 阿嬷
    alt: [阿妈, 阿码]
    pron: a ma
    homophone: 阿码
    enReading: ah-MAH
    zh: 奶奶；外婆
    en: grandma
    meaning: 奶奶，父亲的母亲；外婆也叫“阿嬷”。注意不是妈妈，妈妈叫“娘奶”。
    meaningEn: Grandma — your father's mother, and your mother's mother is called the same. Not "mom" — mother is 娘奶.
    category: kinship

  - id: a-gong
    text: 阿公
    pron: a gong
    homophone: 阿公
    enReading: ah-GONG
    zh: 爷爷；外公
    en: grandpa
    meaning: 爷爷，父亲的父亲；外公也叫“阿公”。奶奶、外婆都叫“阿嬷”。
    meaningEn: Grandpa — your father's father, and your mother's father is called the same. Both grandmothers are 阿嬷 (a ma).
    category: kinship

  - id: a-hia
    text: 阿兄
    alt: [阿丫]
    pron: a hia
    homophone: 阿丫
    enReading: ah-HYAH
    zh: 哥哥
    en: older brother
    meaning: 哥哥，和闽南语的“阿兄”说法相近。
    meaningEn: Older brother, close to the Hokkien "a-hiann".
    category: kinship

  - id: a-di
    text: 阿弟
    alt: [阿哩]
    pron: a li
    homophone: 阿哩
    enReading: ah-LEE
    zh: 弟弟
    en: younger brother
    meaning: 弟弟。
    meaningEn: Younger brother.
    category: kinship

  - id: bing-go
    text: 苹果
    alt: [病过]
    pron: bing go
    homophone: 病过
    enReading: bing-GOH
    zh: 苹果
    en: apple
    meaning: 苹果。
    meaningEn: Apple.
    category: food

  - id: bo-liang-sing
    text: 无良心
    alt: [薄良心]
    pron: bo liang sing
    homophone: 薄良NIN
    enReading: boh-lyahng-SING
    zh: 没良心
    en: heartless
    meaning: 没良心，骂人忘恩负义、不讲情义。
    meaningEn: Heartless — calling someone ungrateful or callous.
    category: slang

  - id: bo-lian-ci
    text: 无廉耻
    alt: [没连成]
    pron: bo lian ci
    homophone: 没连成
    enReading: boh-lyen-CHEE
    zh: 无耻；不要脸
    en: shameless
    note: 骂人的话，语气较重。
    noteEn: An insult with a fairly strong tone.
    category: slang

  - id: niu-le
    text: 娘奶
    pron: niu le
    enReading: nyoo-LEH
    zh: 妈妈；母亲
    en: mum; mother
    meaning: 妈妈、母亲，莆田话很有特色的叫法，和普通话差别很大。注意“阿嬷”是奶奶，不是妈妈。
    meaningEn: Mum or mother — a distinctive Putian word, quite unlike Mandarin. Note that 阿嬷 (a ma) is grandma, not mum.
    category: kinship

  - id: lo-o
    text: 老父
    pron: lo o
    enReading: loh-OH
    zh: 爸爸；父亲
    en: dad; father
    meaning: 父亲，莆田话传统的叫法；现在口语里也常说“阿爸”。
    meaningEn: Father — the traditional Putian word. "A ba" (阿爸) is also common today.
    category: kinship

  - id: gyo
    text: 囝
    pron: gyo
    enReading: gyoh
    zh: 儿子
    en: son
    meaning: 儿子。闽语里“囝”指孩子、儿子，“红囝”是婴儿，“囝婿”是女婿。
    meaningEn: Son. In Min dialects 囝 means child or son — compare 红囝 (baby) and 囝婿 (son-in-law).
    category: kinship

  - id: ang-gyo
    text: 红囝
    pron: ang gyo
    enReading: ahng-GYOH
    zh: 婴儿
    en: baby
    meaning: 婴儿、刚出生不久的小孩。字面是“红色的孩子”，因为新生儿皮肤红红的。
    meaningEn: A baby or newborn — literally "red child", after a newborn's reddish skin.
    literal: 红色的孩子
    category: kinship

  - id: de-a
    text: 低仔
    pron: de a
    enReading: deh-AH
    zh: 小孩；孩子
    en: child; kid
    meaning: 小孩、孩子，泛指小朋友。
    meaningEn: A child or kid, in general.
    category: kinship

  - id: sing-niu
    text: 婶娘
    pron: sing niu
    enReading: sing-NYOO
    zh: 女孩
    en: girl
    meaning: 女孩、姑娘。和普通话里“婶娘”（婶婶）的意思完全不同，别弄混。
    meaningEn: A girl. Nothing to do with Mandarin 婶娘 ("aunt") — easy to mix up.
    category: kinship

  - id: de-bou-yo
    text: 丈夫囝
    pron: de bou yo
    enReading: deh-boh-YOH
    zh: 男孩
    en: boy
    meaning: 男孩。“丈夫”在莆田话里指男人，加上“囝”就是男孩子。
    meaningEn: A boy. 丈夫 means "man" in Putian, and adding 囝 ("child") makes it "boy".
    category: kinship

  - id: sing-mu
    text: 新妇
    pron: sing mu
    enReading: sing-MOO
    zh: 儿媳妇
    en: daughter-in-law
    meaning: 儿媳妇，儿子的妻子。闽语普遍这么叫，字面是“新来的妇人”。
    meaningEn: Daughter-in-law, your son's wife. Common across Min dialects — literally "the new woman".
    category: kinship

  - id: gyo-lai
    text: 囝婿
    pron: gyo lai
    enReading: gyoh-LIE
    zh: 女婿
    en: son-in-law
    meaning: 女婿，女儿的丈夫。
    meaningEn: Son-in-law, your daughter's husband.
    category: kinship

  - id: diu-nang
    text: 丈侬
    pron: diu nang
    enReading: dyoo-NAHNG
    zh: 岳父
    en: father-in-law (wife's father)
    meaning: 岳父，妻子的父亲。“侬”在莆田话里是人；岳母叫“丈姆”。
    meaningEn: Your wife's father. 侬 means "person" in Putian; your wife's mother is 丈姆.
    category: kinship

  - id: diu-ng
    text: 丈姆
    pron: diu ng
    enReading: dyoo-NG
    zh: 岳母
    en: mother-in-law (wife's mother)
    meaning: 岳母，妻子的母亲；岳父叫“丈侬”。
    meaningEn: Your wife's mother; your wife's father is 丈侬.
    category: kinship

  - id: gua-o
    text: 外家
    pron: gua o
    enReading: gwah-OH
    zh: 娘家
    en: a married woman's parents' home
    meaning: 娘家，已婚女性父母的家。
    meaningEn: A married woman's parents' home — the family she was born into.
    category: kinship

  - id: ga-e
    text: 家个
    pron: ga e
    enReading: gah-EH
    zh: 自己
    en: oneself
    meaning: 自己。口语里常把两个音合成一个音 gai，比如“我 gai 行”（我自己走）。
    meaningEn: Oneself. In speech the two syllables often merge into one, "gai", as in "gua gai gia" (I'll walk by myself).
    category: people

  - id: a-mi
    text: 阿毜
    alt: [阿毜狮]
    pron: a mi
    enReading: ah-MEE
    zh: 小屁孩（贬称）
    en: brat
    meaning: 对小孩带贬义的称呼，类似“小屁孩”，也说“阿毜狮”。
    meaningEn: A dismissive word for a child, like "brat"; also 阿毜狮.
    note: 带有轻视意味，当着孩子家长说不礼貌。
    noteEn: Belittling — rude to say in front of the child's parents.
    category: slang
