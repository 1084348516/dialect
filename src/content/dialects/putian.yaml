name: 莆田话
nameEn: Putian (Puxian Min)
status: live
order: 6
reviewed: false
areas: 莆田、仙游，东南亚莆仙籍华人
areasEn: Putian and Xianyou; Puxian communities in Southeast Asia
intro: 通行于福建莆田、仙游一带，属闽语莆仙片，和闽南语相近但读音差别很大。词条拼读为按普通话近似记音，尚未核对。
introEn: Spoken around Putian and Xianyou in Fujian. It belongs to the Puxian branch of Min Chinese — related to Hokkien but quite different in pronunciation. Readings are rough Mandarin-based approximations and have not been checked yet.
romanization: { name: 近似拼读, nameEn: Approximate reading }

categories:
