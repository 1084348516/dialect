areas: 厦门、泉州、漳州、台湾、新加坡、马来西亚
areasEn: Xiamen, Quanzhou, Zhangzhou, Taiwan, Singapore, Malaysia
intro: 通行于福建南部、台湾，以及新加坡、马来西亚、菲律宾等地的华人社区。各地读音和用词有差异，词条中会分别标注。拼音采用台罗。
introEn: Spoken in southern Fujian, Taiwan, and Chinese communities in Singapore, Malaysia and the Philippines. Pronunciation and wording vary by place; entries note the differences. Romanization follows Tâi-lô.
romanization: { name: 台罗拼音, nameEn: Tâi-lô }

