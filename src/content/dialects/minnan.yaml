    meaningEn: A variant of 干恁娘 that swaps "mother" for "teacher". It sounds a bit less direct and is often used to vent frustration, sometimes jokingly.
    literal: 干你的老师
    note: 台湾比较常听到。虽然听起来像玩笑，本质上还是粗口。
    noteEn: Mostly heard in Taiwan. It may sound jokey, but it is still a swear.
    category: crude
    regions: [tw]

  - id: sai-li-bu
    text: 驶你母
    alt: [赛里木, 塞你母, 驶恁娘, 赛恁娘]
    pron: sái lí bú
    homophone: 赛里木
    enReading: SAI lee-BOO
    zh: 骂人的脏话，问候对方母亲
    en: "f*** your mother"
    meaning: 和"干恁娘"意思相近的骂人脏话，同样是问候对方的母亲，语气很重。网上常写成谐音的"赛里木"。
    meaningEn: A curse close in meaning to 干恁娘, also insulting the other person's mother, and very harsh. Online it is often written 赛里木, which sounds similar.
