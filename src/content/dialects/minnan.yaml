name: 闽南语
nameEn: Hokkien / Taiwanese
status: live
order: 1
reviewed: false
areas: 厦门、泉州、漳州、台湾、新加坡、马来西亚
areasEn: Xiamen, Quanzhou, Zhangzhou, Taiwan, Singapore, Malaysia
intro: 通行于福建南部、台湾，以及新加坡、马来西亚、菲律宾等地的华人社区。各地读音和用词有差异，词条中会分别标注。拼音采用台罗。
introEn: Spoken in southern Fujian, Taiwan, and Chinese communities in Singapore, Malaysia and the Philippines. Pronunciation and wording vary by place; entries note the differences. Romanization follows Tâi-lô.
romanization: { name: 台罗拼音, nameEn: Tâi-lô }
traditional: true

regions:
  - { id: xm, name: 厦门, nameEn: Xiamen }
  - { id: qz, name: 泉州, nameEn: Quanzhou }
  - { id: zz, name: 漳州, nameEn: Zhangzhou }
  - { id: tw, name: 台湾, nameEn: Taiwan }
  - { id: sgmy, name: 新马, nameEn: Singapore / Malaysia }

categories:
  - { id: kinship, name: 亲属称谓, nameEn: Family }
  - { id: greeting, name: 日常问候, nameEn: Greetings }
  - { id: daily, name: 日常用语, nameEn: Everyday }
  - { id: food, name: 饮食, nameEn: Food }
  - { id: newyear, name: 过年拜年, nameEn: Chinese New Year }
  - { id: slang, name: 俚语, nameEn: Slang }
  - { id: crude, name: 粗口, nameEn: Crude, caution: true }

entries:
  - id: a-ma
    text: 阿嬷
    alt: [阿妈, 阿嫲]
    pron: a-má
    homophone: 阿妈
    enReading: ah-MAH
    spellings: [ah ma]
    zh: 奶奶；祖母
    en: grandma
    meaning: 奶奶，父亲的母亲。日常当面称呼和背后提起都可以用。
    meaningEn: Grandma (father's mother). Used both to address her directly and to talk about her.
    note: 外婆（母亲的母亲）一般叫"外嬷"（guā-má），见家长时别叫错。
    noteEn: Your mother's mother is usually "guā-má" (外嬷) — don't mix them up when meeting the family.
    category: kinship
    featured: true
    examples:
      - text: 阿嬷，我转来矣。
        pron: A-má, guá tńg--lâi--ah.
        zh: 奶奶，我回来了。
        en: Grandma, I am home.
      - text: 阿嬷，你食饱未？
        pron: A-má, lí tsia̍h-pá--buē?
        zh: 奶奶，你吃饱了吗？
        en: Grandma, have you eaten?
    variants:
      - { region: 台湾, text: 阿嬷 a-má, note: 最常见的写法 }
      - { region: 新加坡 / 马来西亚, text: Ah Ma, note: 英文常写作 Ah Ma 或 Ama }
      - { region: 厦门, text: ~, note: ~ }
      - { region: 泉州 / 漳州, text: ~, note: 部分地区说法可能不同 }

  - id: a-kong
    text: 阿公
    pron: a-kong
    homophone: 阿公
    enReading: ah-KONG
    spellings: [ah kong, ah gong]
    zh: 爷爷；祖父
    en: grandpa
    meaning: 爷爷，父亲的父亲。
    meaningEn: Grandpa (father's father).
    category: kinship

  - id: gua-ma
    text: 外嬷
    pron: guā-má
    homophone: 瓜妈
    enReading: gwah-MAH
    zh: 外婆
    en: grandma (mother's side)
    meaning: 外婆，母亲的母亲。
    meaningEn: Grandma on your mother's side.
    category: kinship

  - id: gua-kong
    text: 外公
    pron: guā-kong
    homophone: 瓜公
    enReading: gwah-KONG
    zh: 外公
    en: grandpa (mother's side)
    meaning: 外公，母亲的父亲。
    meaningEn: Grandpa on your mother's side.
    category: kinship

  - id: a-pah
    text: 阿爸
    pron: a-pah
    homophone: 阿爸
    enReading: ah-PAH
    zh: 爸爸
    en: dad
    meaning: 爸爸。当面叫、背后提起都可以用。
    meaningEn: Dad — used both to address him and to talk about him.
    category: kinship

  - id: a-bu
    text: 阿母
    pron: a-bú
    homophone: 阿某
    enReading: ah-BOO
    zh: 妈妈
    en: mum
    meaning: 妈妈，母亲。“母”读 bú，网上常写成谐音的“阿某”。
    meaningEn: Mum. 母 is read "bú"; online it is often written 阿某, which sounds the same.
    category: kinship

  - id: a-hiann
    text: 阿兄
    pron: a-hiann
    enReading: ah-HYAH
    zh: 哥哥
    en: older brother
    meaning: 哥哥。“兄”读 hiann，前面可以加排行，比如“大兄”（tuā-hiann，大哥）。
    meaningEn: Older brother. 兄 is read "hiann", and birth order can go in front, as in "tuā-hiann" (eldest brother).
    note: hiann 的 nn 表示鼻化音，不单独发音。
    noteEn: The "nn" in hiann marks a nasal vowel; it is not pronounced as a separate n.
    category: kinship

  - id: a-tsi
    text: 阿姊
    pron: a-tsí
    homophone: 阿济
    enReading: ah-JEE
    zh: 姐姐
    en: older sister
    meaning: 姐姐。大姐叫“大姊”（tuā-tsí）。
    meaningEn: Older sister. The eldest sister is "tuā-tsí" (大姊).
    category: kinship

  - id: sio-ti
    text: 小弟
    pron: sió-tī
    enReading: syoh-DEE
    zh: 弟弟
    en: younger brother
    meaning: 弟弟。“小”在这里读 sió，妹妹叫“小妹”（sió-muē）。
    meaningEn: Younger brother. 小 is read "sió" here; a younger sister is "sió-muē" (小妹).
    category: kinship

  - id: gin-a
    text: 囝仔
    pron: gín-á
    homophone: 紧阿
    enReading: GIN-ah
    zh: 小孩
    en: child; kid
    category: kinship
    examples:
      - text: 囝仔人有耳无喙。
        pron: Gín-á-lâng ū hīnn bô tshuì.
        zh: 小孩子有耳朵没嘴巴（大人说话小孩别插嘴）。
        en: Children have ears but no mouth (kids should listen, not interrupt).

  - id: to-sia
    text: 多谢
    pron: to-siā
    homophone: 多下
    enReading: doh-SIAH
    spellings: [to sia, toh sia]
    zh: 谢谢
    en: thank you
    meaning: 谢谢。闽南语最通用的道谢说法，台湾也常说“感谢”（kám-siā）；别人帮你做事时还可以说“劳力”。
    meaningEn: Thank you — the standard Hokkien thanks. In Taiwan people also say "kám-siā" (感谢), and "lóo-la̍t" when someone has done something for you.
    category: greeting
    featured: true
    examples:
      - text: 多谢你的帮忙。
        pron: To-siā lí ê pang-tsān.
        zh: 谢谢你的帮忙。
        en: Thanks for your help.

  - id: tsiah-pa-bue
    text: 食饱未
    alt: [呷饱未, 吃饱没]
    pron: tsia̍h-pá--buē
    homophone: 甲饱没
    enReading: jah-PAH-bweh
    spellings: [chia pa boe, jiak ba buay]
    zh: 吃饱了吗（打招呼）
    en: have you eaten?
    meaning: 字面是“吃饱了没有”，是闽南人熟人见面最常用的问候。网上常写成谐音的“呷饱未”“甲饱没”。回答一般说“食饱矣”（吃饱了）。
    meaningEn: Literally "have you eaten your fill yet?" — the most common greeting between people who know each other. Online it is often written 呷饱未. The usual reply is "tsia̍h-pá--ah" (I have).
    note: 熟人见面的问候，不一定真的在问你吃没吃。
    noteEn: A greeting between people who know each other — not necessarily a question about food.
    category: greeting
    examples:
      - text: 你食饱未？——食饱矣。
        pron: Lí tsia̍h-pá--buē? —— Tsia̍h-pá--ah.
        zh: 你吃饱了吗？——吃饱了。
        en: Have you eaten? — Yes, I have.

  - id: phainn-se
    text: 歹势
    pron: pháinn-sè
    homophone: 派谢
    enReading: PIE-seh
    spellings: [paiseh, paisay, pai seh]
    zh: 不好意思；抱歉
    en: sorry / paiseh
    meaning: 不好意思、抱歉，也可以表示害羞、难为情。麻烦别人、道歉、婉拒时都常用。
    meaningEn: Sorry, excuse me — and also "embarrassed" or "shy". Used when troubling someone, apologising or turning something down.
    note: 新加坡、马来西亚的英语里也常说 "paiseh"。
    noteEn: Singaporean and Malaysian English also use "paiseh".
    category: greeting
    regions: [tw, sgmy]
    featured: true
    examples:
      - text: 歹势，我来晏矣。
        pron: Pháinn-sè, guá lâi uànn--ah.
        zh: 不好意思，我来晚了。
        en: Sorry, I'm late.

  - id: li-ho
    text: 你好
    pron: lí hó
    homophone: 里火
    enReading: lee-HOH
    spellings: [li ho, lee hor]
    zh: 你好
    en: hello
    meaning: 你好。闽南人日常见面其实更常问“食饱未？”，“你好”多用在比较客气或初次见面的场合。
    meaningEn: Hello. In daily life people more often greet with "tsia̍h-pá--buē?" (have you eaten?); "lí hó" is for polite settings and first meetings.
    category: greeting

  - id: tsai-hue
    text: 再会
    pron: tsài-huē
    enReading: jai-HWEH
    spellings: [chai hue]
    zh: 再见
    en: goodbye
    meaning: 再见，比较正式的道别说法；日常口语里也常说“拜拜”。
    meaningEn: Goodbye — the more formal farewell. In casual speech people also just say "bye-bye".
    category: greeting

  - id: bo-iau-kin
    text: 无要紧
    pron: bô-iàu-kín
    homophone: 莫要紧
    enReading: boh-yow-KIN
    zh: 没关系；不要紧
    en: never mind; it's fine
    note: 别人跟你说"歹势"的时候，可以回一句"无要紧"。
    noteEn: A natural reply when someone says "pháinn-sè" (sorry) to you.
    category: greeting

  - id: bian-kheh-khi
    text: 免客气
    pron: bián kheh-khì
    enReading: byen keh-KEE
    zh: 不用客气
    en: you're welcome
    meaning: 不用客气。“免”就是不用，这是回应别人道谢最常用的话。
    meaningEn: You're welcome. 免 means "no need", so it is literally "no need to be polite" — the usual reply to thanks.
    category: greeting
    examples:
      - text: 多谢！——免客气。
        pron: To-siā! —— Bián kheh-khì.
        zh: 谢谢！——不用客气。
        en: Thanks! — You're welcome.

  - id: loo-lat
    text: 劳力
    pron: lóo-la̍t
    homophone: 劳辣
    enReading: loh-LAHT
    zh: 谢谢（麻烦你了）
    en: thanks for your trouble
    note: 台湾常用，别人帮你做事时说，意思接近"辛苦你了"。
    noteEn: Common in Taiwan when someone has done something for you, a bit like "thanks for the trouble".
    category: greeting
    regions: [tw]

  - id: an-tsuann
    text: 按怎
    pron: án-tsuánn
    homophone: 安怎
    enReading: ahn-TSWAH
    zh: 怎么；怎么了
    en: how; what's wrong
    category: daily
    examples:
      - text: 你是按怎？
        pron: Lí sī án-tsuánn?
        zh: 你怎么了？
        en: What's the matter with you?

  - id: siann-mih
    text: 啥物
    pron: siánn-mih
    homophone: 啥米
    enReading: SYAH-mee
    zh: 什么
    en: what
    category: daily
    examples:
      - text: 这是啥物？
        pron: Tse sī siánn-mih?
        zh: 这是什么？
        en: What is this?

  - id: m-tsai
    text: 毋知
    pron: m̄-tsai
    homophone: 嗯栽
    enReading: mm-JAI
    spellings: [m chai]
    zh: 不知道
    en: I don't know
    category: daily
    examples:
      - text: 我毋知。
        pron: Guá m̄-tsai.
        zh: 我不知道。
        en: I don't know.

  - id: u-iann
    text: 有影
    pron: ū-iánn
    homophone: 有影
    enReading: oo-YAH
    zh: 真的；确实
    en: really; true
    category: daily
    examples:
      - text: 有影无？
        pron: Ū-iánn--bô?
        zh: 真的假的？
        en: Really?

  - id: tsiok
    text: 足
    pron: tsiok
    enReading: jyok
    spellings: [chiok]
    zh: 很；非常
    en: very
    category: daily
    examples:
      - text: 今仔日足热。
        pron: Kin-á-ji̍t tsiok jua̍h.
        zh: 今天很热。
        en: It's really hot today.

  - id: sui
    text: 媠
    pron: suí
    homophone: 水
    enReading: swee
    zh: 漂亮；好看
    en: pretty; beautiful
    meaning: 漂亮、好看，可以夸人，也可以夸东西、风景。
    meaningEn: Pretty or beautiful — for people, things or scenery.
    category: daily
    examples:
      - text: 你今仔日足媠。
        pron: Lí kin-á-ji̍t tsiok suí.
        zh: 你今天很漂亮。
        en: You look really pretty today.

  - id: ho-se
    text: 好势
    pron: hó-sè
    enReading: hoh-SEH
    zh: 妥当；弄好了
    en: all set; sorted
    meaning: 妥当、顺利，事情办好了就说“好势矣”。台湾也用来表示舒服、方便。
    meaningEn: All set, sorted — when something is done you say "hó-sè--ah". In Taiwan it can also mean comfortable or convenient.
    category: daily

  - id: tshu
    text: 厝
    pron: tshù
    homophone: 粗
    enReading: choo
    spellings: [chu]
    zh: 房子；家
    en: house; home
    category: daily
    examples:
      - text: 我欲转去厝。
        pron: Guá beh tńg-khì tshù.
        zh: 我要回家。
        en: I'm going home.

  - id: ho-tsiah
    text: 好食
    pron: hó-tsia̍h
    homophone: 好呷
    enReading: hoh-JAH
    spellings: [ho chiak, ho jiak]
    zh: 好吃
    en: tasty
    category: food
    examples:
      - text: 这足好食！
        pron: Tse tsiok hó-tsia̍h!
        zh: 这个很好吃！
        en: This is really tasty!

  - id: lim
    text: 啉
    pron: lim
    homophone: 林
    enReading: lim
    zh: 喝
    en: to drink
    category: food
    examples:
      - text: 来啉茶。
        pron: Lâi lim tê.
        zh: 来喝茶。
        en: Come have some tea.

  - id: mue
    text: 糜
    pron: muê
    enReading: mweh
    zh: 稀饭；粥
    en: rice porridge; congee
    note: 台湾和漳州一带也常读 bê。
    noteEn: Often pronounced "bê" in Taiwan and around Zhangzhou.
    category: food

  - id: o-a-tsian
    text: 蚵仔煎
    pron: ô-á-tsian
    homophone: 蚵阿煎
    enReading: oh-ah-JEN
    spellings: [o a chian]
    zh: 海蛎煎
    en: oyster omelette
    meaning: 用蚵仔（小牡蛎）、鸡蛋和番薯粉一起煎成的小吃，是闽南、台湾夜市的代表美食。
    meaningEn: A pan-fried dish of small oysters, egg and sweet-potato starch — a night-market classic in southern Fujian and Taiwan.
    category: food
    regions: [xm, tw, sgmy]

  - id: loo-bah-png
    text: 卤肉饭
    pron: lóo-bah-pn̄g
    enReading: loh-bah-PNG
    spellings: [lo bah png, loh bah png]
    zh: 卤肉饭
    en: braised pork rice
    meaning: 把肥瘦相间的猪肉丁卤透后浇在白饭上，是台湾最有代表性的家常小吃。
    meaningEn: Finely diced pork belly braised in soy sauce and spooned over rice — Taiwan's signature comfort food.
    category: food
    regions: [tw]

  - id: sin-ni-khuai-lok
    text: 新年快乐
    pron: sin-nî khuài-lo̍k
    enReading: sin-NEE kwai-LOK
    zh: 新年快乐
    en: happy new year
    meaning: 过年见面说的祝福语，和普通话“新年快乐”意思一样。
    meaningEn: The New Year greeting, the same as Mandarin "xin nian kuai le".
    category: newyear

  - id: kiong-hi-huat-tsai
    text: 恭喜发财
    pron: kiong-hí huat-tsâi
    enReading: kyong-HEE hwat-CHAI
    spellings: [kiong hee huat chai]
    zh: 恭喜发财（拜年用语）
    en: wishing you prosperity
    meaning: 过年见面最常用的祝福语，祝对方新的一年发财。
    meaningEn: The most common Chinese New Year greeting, wishing someone wealth in the year ahead.
    category: newyear

  - id: ang-pau
    text: 红包
    pron: âng-pau
    homophone: 昂包
    enReading: ahng-POW
    spellings: [ang pao, ang pow]
    zh: 红包
    en: red packet
    note: 新马英语里常写作 "ang pow" 或 "ang bao"。
    noteEn: In Singaporean and Malaysian English it is often written "ang pow" or "ang bao".
    category: newyear

  - id: ui-loo
    text: 围炉
    pron: uî-lôo
    enReading: wee-LOH
    zh: 吃年夜饭
    en: New Year's Eve family dinner
    literal: 围着炉子
    note: 除夕全家围着一起吃团圆饭。
    noteEn: The whole family gathers around the table for the reunion dinner on New Year's Eve.
    category: newyear
    regions: [tw]

  - id: koo-tsui
    text: 古锥
    pron: kóo-tsui
    homophone: 古追
    enReading: koh-JWEE
    spellings: [ko chui]
    zh: 可爱
    en: cute
    meaning: 可爱，多用来形容小孩、小动物或者小巧的东西。
    meaningEn: Cute — usually said of children, small animals or dainty things.
    category: slang
    examples:
      - text: 这个囝仔足古锥。
        pron: Tsit ê gín-á tsiok kóo-tsui.
        zh: 这个小孩很可爱。
        en: This kid is so cute.

  - id: ke-po
    text: 鸡婆
    pron: ke-pô
    enReading: keh-POH
    spellings: [kaypoh, kay poh]
    zh: 多管闲事
    en: nosy; busybody
    meaning: 爱管闲事、多事。台湾也用来说一个人过分热心。
    meaningEn: Nosy, a busybody. In Taiwan it can also mean overly helpful or meddling.
    note: 新马英语里的 "kaypoh" 就是这个词。
    noteEn: This is where Singaporean and Malaysian English "kaypoh" comes from.
    category: slang
    regions: [tw, sgmy]

  - id: khi-siau
    text: 起痟
    pron: khí-siáu
    homophone: 起肖
    enReading: kee-SYOW
    spellings: [khi siao, kee siao]
    zh: 发疯；疯了
    en: to go crazy
    meaning: 发疯、疯了，也常用来说对方的想法或做法很离谱。
    meaningEn: To go crazy — also said when someone's idea or behaviour is ridiculous.
    category: slang

  - id: kong-peh-tshat
    text: 讲白贼
    pron: kóng pe̍h-tsha̍t
    enReading: kong peh-CHAHT
    zh: 说谎
    en: to tell lies
    meaning: 说谎。“白贼”就是谎话，“讲白贼”就是说谎话。
    meaningEn: To tell lies. 白贼 means a lie, so "kóng pe̍h-tsha̍t" is "to speak lies".
    category: slang

  - id: phong-hong
    text: 膨风
    pron: phòng-hong
    enReading: pong-HONG
    zh: 吹牛；夸大
    en: to brag
    literal: 鼓起风
    meaning: 吹牛、说大话，也指把事情夸大。字面是把风吹得鼓起来。
    meaningEn: To brag or exaggerate — literally "to puff up with air".
    category: slang

  - id: lau-khui
    text: 漏气
    pron: lāu-khuì
    enReading: lau-KWEE
    zh: 丢脸；出糗
    en: embarrassing; to lose face
    meaning: 丢脸、出糗；表现不好、让人失望时也可以说“真漏气”。
    meaningEn: Embarrassing, to lose face — also said of a disappointing performance.
    category: slang
    regions: [tw]

  - id: tshin-tshai
    text: 凊彩
    alt: [青菜]
    pron: tshìn-tshái
    enReading: chin-CHAI
    zh: 随便；都可以
    en: whatever; anything goes
    note: 台湾口语常用，网上常写成谐音的"青菜"。
    noteEn: Common in Taiwanese speech; online it is often written 青菜 ("vegetables"), which sounds similar.
    category: slang
    regions: [tw]

  - id: tsiah-sai
    text: 食屎
    alt: [炸塞, 呷赛]
    pron: tsia̍h-sái
    homophone: 呷赛
    enReading: jah-SAI
    zh: 骂人或表示不满（粗口）
    en: crude insult
    meaning: 字面是“吃屎”，用来骂人或表示强烈不满。网上常写成谐音的“呷赛”。
    meaningEn: Literally "eat shit" — used to curse someone or vent strong annoyance. Online it is often written 呷赛, which sounds the same.
    category: crude

  - id: kan
    text: 干
    alt: [姦, 幹]
    pron: kàn
    homophone: 干
    enReading: KAHN
    zh: 骂人、发泄情绪的粗口
    en: "f***"
    meaning: 最常见的闽南语粗口，单说一个字用来发泄惊讶、生气或不爽，相当于普通话的"靠""操"。
    meaningEn: The most common Hokkien swear word. Said on its own to vent surprise, anger or annoyance, like "f***!" in English.
    note: 本字写作"姦"，网上多写成"干"或"幹"。很多人当口头禅，但在长辈和正式场合千万别说。
    noteEn: The original character is 姦; online it is usually written 干 or 幹. Many people use it as a verbal tic, but never say it in front of elders or in formal settings.
    category: crude

  - id: kan-lin-nia
    text: 干恁娘
    alt: [姦恁娘, 干林娘, 干你娘]
    pron: kàn lín-niâ
    homophone: 干林娘
    enReading: KAHN lin-NYAH
    zh: 骂人的脏话，问候对方母亲
    en: "f*** your mother"
    meaning: 闽南语里最典型的骂人脏话，字面是问候对方的母亲，相当于普通话的"操你妈"。生气时骂人，也有人当口头禅发泄。
    meaningEn: The classic Hokkien curse, literally insulting the other person's mother, like "f*** your mother". Used to curse someone in anger, or by some as a verbal tic.
    literal: 干你的娘（"恁"是你、你们，"娘"指母亲）
    note: 非常冒犯，冲着人说很容易引发冲突，了解即可。
    noteEn: Highly offensive — saying it at someone can easily start a fight. Good to recognize, not to use.
    category: crude

  - id: kan-lin-lau-su
    text: 干恁老师
    alt: [姦恁老師, 干林老师]
    pron: kàn lín lāu-su
    homophone: 干林老师
    enReading: KAHN lin low-SOO
    zh: 骂人的脏话，干恁娘的变体
    en: a variant of "f*** your mother"
