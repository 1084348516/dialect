name: 上海话
nameEn: Shanghainese
status: live
order: 5
reviewed: false
areas: 上海及周边吴语地区
areasEn: Shanghai and the surrounding Wu-speaking region
intro: 通行于上海市区及周边，属吴语，和普通话差别很大，保留了浊音和入声。拼音采用吴语协会拼音，暂不标声调；q 结尾表示短促的入声。
introEn: Spoken in Shanghai and the surrounding area. It is a Wu dialect, very different from Mandarin, and keeps voiced consonants and clipped "entering" tones. Romanization follows Wugniu, without tone marks; a final q marks a short, clipped syllable.
romanization: { name: 吴语拼音, nameEn: Wugniu }

categories:
  - { id: kinship, name: 亲属称谓, nameEn: Family }
  - { id: greeting, name: 日常问候, nameEn: Greetings }
  - { id: daily, name: 日常用语, nameEn: Everyday }
  - { id: slang, name: 俚语, nameEn: Slang }
  - { id: crude, name: 粗口, nameEn: Crude, caution: true }

entries:
  - id: aq-gnian
    text: 阿娘
    pron: aq gnian
    enReading: ah-NYAHNG
    zh: 奶奶；祖母
    en: grandma
    meaning: 上海话里“阿娘”指奶奶（父亲的母亲），不是妈妈。
    meaningEn: In Shanghainese "aq gnian" means grandma (father's mother), not mum.
    category: kinship

  - id: aq-ya
    text: 阿爷
    pron: aq ya
    enReading: ah-YAH
    zh: 爷爷；祖父
    en: grandpa
    meaning: 爷爷，父亲的父亲。上海话叫奶奶是“阿娘”，叫爷爷就是“阿爷”。
    meaningEn: Grandpa (father's father). Grandma on the same side is "aq gnian" (阿娘).
    category: kinship

  - id: nga-bu
    text: 外婆
    pron: nga bu
    enReading: ngah-BOO
    zh: 外婆
    en: grandma (mother's side)
    meaning: 外婆，母亲的母亲。上海话“外”读 nga，和普通话的读音差别很大。
    meaningEn: Grandma on your mother's side. 外 is read "nga" in Shanghainese, very different from Mandarin "wai".
    category: kinship

  - id: nga-kon
    text: 外公
    pron: nga kon
    enReading: ngah-KONG
    zh: 外公
    en: grandpa (mother's side)
    meaning: 外公，母亲的父亲。和“外婆”（nga bu）一样，“外”读 nga。
    meaningEn: Grandpa on your mother's side. As in "nga bu" (grandma), 外 is read "nga".
    category: kinship

  - id: m-ma
    text: 姆妈
    pron: m ma
    homophone: 嗯妈
    enReading: mm-MAH
    zh: 妈妈
    en: mum
    meaning: 妈妈。上海话传统的叫法，“姆”读成一个闭口的 m 音；现在年轻人也常直接叫“妈妈”。
    meaningEn: Mum — the traditional Shanghainese word. 姆 is just a closed-lip "m" sound. Younger people also simply say "ma ma".
    category: kinship
    featured: true

  - id: aq-pa
    text: 阿爸
    pron: aq pa
    enReading: ah-PAH
    zh: 爸爸
    en: dad
    meaning: 爸爸。当面叫、背后提起都可以用，也有人直接叫“爸爸”。
    meaningEn: Dad — used both to address him and to talk about him. Some people simply say "pa pa".
    category: kinship

  - id: ya-soq
    text: 爷叔
    pron: ya soq
    enReading: yah-SOH
    zh: 叔叔（对年长男性的称呼）
    en: uncle (for an older man)
    meaning: 对比自己年长的男性的尊称，不一定是亲戚。
    meaningEn: A respectful way to address an older man, related or not.
    category: kinship

  - id: shiau-noe
    text: 小囡
    pron: shiau noe
    enReading: shyaw-NUH
    zh: 小孩
    en: child; kid
    meaning: 小孩子。“囡”在上海话里指孩子，男孩女孩都可以叫“小囡”。
    meaningEn: A child. 囡 means child in Shanghainese, and "shiau noe" covers both boys and girls.
    category: kinship

  - id: non-hau
    text: 侬好
    pron: non hau
    homophone: 侬好
    enReading: nong-HAW
    zh: 你好
    en: hello
    meaning: 你好。“侬”就是你。熟人见面其实更常直接打招呼，或者问一句“吃过了伐”；“侬好”多用在初次见面或比较客气的场合。
    meaningEn: Hello. "Non" means you. Friends usually just greet each other or ask "have you eaten?"; "non hau" is more for first meetings and polite settings.
    category: greeting
    featured: true

  - id: zhia-zhia-non
    text: 谢谢侬
    pron: zhia zhia non
    homophone: 霞霞侬
    enReading: zhyah-zhyah-NONG
    zh: 谢谢你
    en: thank you
    meaning: 谢谢你。“侬”就是你，也可以只说“谢谢”。上海话的“谢”是浊音，读起来像 zhia，和普通话的 xie 不一样。
    meaningEn: Thank you. "Non" means you; you can also just say "zhia zhia". 谢 is a voiced sound in Shanghainese, closer to "zhia" than Mandarin "xie".
    category: greeting

  - id: tse-we
    text: 再会
    pron: tse we
    homophone: 再威
    enReading: tseh-WAY
    zh: 再见
    en: goodbye
    meaning: 再见。“再会”是上海话传统的道别说法，现在日常也常说“拜拜”。
    meaningEn: Goodbye — the traditional Shanghainese farewell. In everyday speech people also say "bye-bye".
    category: greeting

  - id: chiq-ku-leq-va
    text: 侬吃过了伐
    pron: non chiq ku leq va
    enReading: nong-chih-koo-luh-VAH
    zh: 你吃过了吗？
    en: have you eaten?
    note: 熟人见面的客套问候。“伐”放在句尾表示疑问。
    noteEn: A friendly greeting. The final "va" turns a sentence into a yes/no question.
    category: greeting

  - id: aq-la
    text: 阿拉
    pron: aq la
    homophone: 阿拉
    enReading: ah-LAH
    zh: 我们；我
    en: we; I
    meaning: 原意是“我们”，上海人也常用来说“我”，比如“阿拉上海人”。
    meaningEn: Literally "we", but often used for "I" too, as in "aq la Zaon-he nin" (we Shanghainese).
    category: daily

  - id: non
    text: 侬
    pron: non
    enReading: nong
    zh: 你
    en: you
    meaning: 你。上海话最有代表性的字之一，“侬好”就是你好。“你们”说“那”（na）。
    meaningEn: You — one of the most recognisable Shanghainese words, as in "non hau" (hello). Plural "you" is "na" (那).
    category: daily

  - id: yi
    text: 伊
    pron: yi
    enReading: yee
    zh: 他；她
    en: he; she
    meaning: 他、她都说“伊”，不分男女。“他们”说“伊拉”（yi la）。
    meaningEn: He or she — Shanghainese uses the same word for both. "They" is "yi la" (伊拉).
    category: daily

  - id: tsu-sa
    text: 做啥
    pron: tsu sa
    homophone: 足啥
    enReading: tsoo-SAH
    zh: 干什么；为什么
    en: what for; why
    category: daily
    examples:
      - text: 侬做啥？
        pron: non tsu sa?
        zh: 你干什么？
        en: What are you doing?

  - id: ci-di
    text: 几钿
    pron: ci di
    enReading: jee-DEE
    zh: 多少钱
    en: how much (money)?
    meaning: 多少钱。“钿”就是钱，“几钿”是买东西时最常用的问价说法。
    meaningEn: How much? 钿 means money, and "ci di" is the standard way to ask a price.
    category: daily
    examples:
      - text: 迭个几钿？
        pron: diq geq ci di?
        zh: 这个多少钱？
        en: How much is this?

  - id: veq
    text: 勿
    pron: veq
    enReading: vuh
    zh: 不
    en: not
    meaning: 不。上海话的否定词用“勿”，比如“勿晓得”（不知道）、“勿要”（不要，口语里常连读成“覅” fiau）。
    meaningEn: Not. Shanghainese negates with 勿, as in "veq shiau teq" (don't know) and "veq iau" (don't want), often merged into "fiau" (覅).
    category: daily
    examples:
      - text: 我勿晓得。
        pron: ngu veq shiau teq.
        zh: 我不知道。
        en: I don't know.

  - id: ciau-kue
    text: 交关
    pron: ciau kue
    enReading: jyaw-KWEH
    zh: 很；非常
    en: very; extremely
    meaning: 很、非常，放在形容词前面，比如“交关好”（非常好）；也可以表示数量多，比如“交关人”（很多人）。
    meaningEn: Very — goes before an adjective, as in "ciau kue hau" (really good). It can also mean "a lot", as in "ciau kue nin" (lots of people).
    category: daily
    examples:
      - text: 今朝交关热。
        pron: cin tsau ciau kue gniq.
        zh: 今天很热。
        en: It's really hot today.

  - id: iq-nge-nge
    text: 一眼眼
    pron: iq nge nge
    enReading: ih-ngeh-ngeh
    zh: 一点点
    en: a tiny bit
    meaning: 一点点，形容数量很少或者东西很小。
    meaningEn: A tiny bit — a very small amount or a very small thing.
    category: daily

  - id: cin-tsau
    text: 今朝
    pron: cin tsau
    enReading: jin-TSAW
    zh: 今天
    en: today
    note: 明天叫“明朝”（min tsau），昨天叫“昨日”（zoq gniq）。
    noteEn: Tomorrow is "min tsau" (明朝) and yesterday is "zoq gniq" (昨日).
    category: daily

  - id: oq-li-shian
    text: 屋里厢
    pron: oq li shian
    enReading: oh-lee-SHYAHNG
    zh: 家里
    en: at home
    meaning: 家里。“屋里”就是家，后面的“厢”表示里面、那一边，“屋里厢”就是家里头。
    meaningEn: At home. "Oq li" means home and "shian" means "inside", so together it is "in the house".
    category: daily

  - id: loq-yu
    text: 落雨
    pron: loq yu
    enReading: loh-YOO
    zh: 下雨
    en: to rain
    meaning: 下雨。吴语、粤语、闽语都把下雨叫“落雨”，下雪也说“落雪”。
    meaningEn: To rain. Wu, Cantonese and Min dialects all say "fall rain" for raining, and "fall snow" for snowing.
    category: daily

  - id: da-yoq
    text: 汏浴
    pron: da yoq
    enReading: dah-YOH
    zh: 洗澡
    en: to take a bath
    meaning: 洗澡。上海话的“汏”就是洗，洗衣服说“汏衣裳”，洗手说“汏手”。
    meaningEn: To take a bath or shower. 汏 means "to wash" — you also 汏 your clothes or your hands.
    category: daily

  - id: lau-lin-gheq
    text: 老灵个
    pron: lau lin gheq
    enReading: law-LIN-guh
    zh: 很好；很棒
    en: really good
    meaning: 很好、很棒。“老”在这里表示很，“灵”就是好、灵光，用来夸东西或事情。
    meaningEn: Really good. 老 here means "very" and 灵 means good or clever; used to praise things and situations.
    category: slang
    examples:
      - text: 迭家店老灵个。
        pron: diq ka ti lau lin gheq.
        zh: 这家店很好。
        en: This shop is really good.

  - id: tia
    text: 嗲
    pron: tia
    enReading: dyah
    zh: 好；漂亮；撒娇
    en: great; lovely; coy
    meaning: 可以夸东西好、人漂亮，也可以形容说话撒娇。
    meaningEn: Praises something as great or someone as lovely; can also describe a coy, sweet way of talking.
    category: slang

  - id: tsoq
    text: 作
    pron: tsoq
    enReading: tsoh
    zh: 无理取闹；难伺候
    en: high-maintenance; to make a fuss
    meaning: 形容人（多指女性）爱折腾、无理取闹、难伺候。
    meaningEn: Describes someone (often a woman) who makes a fuss over nothing and is hard to please.
    category: slang

  - id: lin-teq-chin
    text: 拎得清
    pron: lin teq chin
    enReading: lin-tuh-CHIN
    zh: 明事理；懂分寸
    en: sensible; knows what's what
    note: 反过来说就是“拎勿清”（lin veq chin），指人糊涂、不懂分寸。
    noteEn: The opposite is "lin veq chin" (拎勿清) — clueless, doesn't read the room.
    category: slang

  - id: ciq-kuen
    text: 结棍
    pron: ciq kuen
    enReading: jih-KWUN
    zh: 厉害；猛烈
    en: intense; formidable
    meaning: 厉害、猛，形容程度很高。天热得厉害、酒很冲、人很能干，都可以说“结棍”。
    meaningEn: Intense or formidable. Scorching weather, strong liquor or a very capable person can all be "ciq kuen".
    category: slang

  - id: chian-diau
    text: 腔调
    pron: chian diau
    enReading: chyahng-DYAW
    zh: 派头；样子
    en: style; flair
    meaning: 原指说话的调子，上海话里常指一个人的气质派头，“有腔调”就是有范儿。
    meaningEn: Originally "tone of voice"; in Shanghainese it means style — "having chian diau" is having class.
    category: slang

  - id: ka-se-wu
    text: 嘎讪胡
    pron: ka se wu
    enReading: kah-seh-WOO
    zh: 闲聊
    en: to chat
    meaning: 闲聊、聊天，也写作“嘎三胡”。
    meaningEn: To chat or shoot the breeze; also written 嘎三胡.
    category: slang

  - id: wa-theq
    text: 瓦特
    alt: [坏脱]
    pron: wa theq
    homophone: 瓦特
    enReading: wah-TUH
    zh: 坏了；完蛋了
    en: broken; done for
    meaning: 东西坏掉了，或者事情搞砸了、人不行了。本字是“坏脱”（坏掉），“瓦特”是网上流行的谐音写法，常说“瓦特了”。
    meaningEn: Broken, or more loosely ruined or done for. The original characters are 坏脱 ("broken off"); 瓦特 (the Chinese name of James Watt) is the popular phonetic spelling online, usually as "wa theq leq".
    literal: “坏脱”，坏掉了。
    note: 也可以拿来自嘲，比如“脑子瓦特了”就是脑子坏掉了、犯糊涂。
    noteEn: Often self-mocking — "my brain's wa theq" means you're not thinking straight.
    category: slang
    examples:
      - text: 电脑又瓦特了。
        pron: di nau yi wa theq leq.
        zh: 电脑又坏了。
        en: The computer's broken again.
      - text: 侬脑子瓦特了？
        pron: non nau tsy wa theq leq?
        zh: 你脑子坏掉了吧？
        en: Have you lost your mind?

  - id: gaon-du
    text: 戆大
    pron: gaon du
    enReading: gahng-DOO
    zh: 傻瓜
    en: fool; idiot
    note: 熟人之间开玩笑可以说，对不熟的人说不礼貌。
    noteEn: Fine as a joke between friends, rude to someone you don't know.
    category: crude

  - id: tsheq-na
    text: 册那
    alt: [冊那, 赤那, 策那]
    pron: tsheq na
    enReading: tsuh-NAH
    zh: 骂人或表示不满（粗口）
    en: crude curse
    meaning: 上海话里最常见的粗口口头禅，相当于普通话的“他妈的”。可以用来骂人，但更多是自言自语地抱怨，或者表示惊讶、不耐烦。
    meaningEn: The most common Shanghainese swear word, roughly "damn it". More often muttered to vent annoyance or surprise than aimed at someone.
    literal: 一般认为是“操那（娘）”的谐音写法，“那”在上海话里是“你们”的意思。
    note: 很粗俗的口头禅，不要对人说。
    noteEn: A very vulgar exclamation — don't say it to anyone.
    category: crude
    examples:
      - text: 册那，又落雨了！
        pron: tsheq na, yi loq yu leq!
        zh: 他妈的，又下雨了！
        en: Damn, it's raining again!
